name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build --stacktrace --no-daemon --console=plain

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-mod-${{ github.ref_name }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          JAR=$(ls build/libs/backrooms-*.jar | grep -v -- '-sources.jar' | head -1)
          echo "Releasing $JAR as $TAG"
          gh release create "$TAG" "$JAR" \
            --title "The Backrooms $TAG" \
            --notes "Automated release of The Backrooms mod for Minecraft 1.21.1 (Fabric). Download the attached .jar and place it in your mods folder (requires Fabric API)."
