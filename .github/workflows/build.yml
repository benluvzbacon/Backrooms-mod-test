name: build

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        id: build
        run: bash .github/ci_build.sh

      - name: Report compile errors
        if: always() && steps.build.outcome == 'failure'
        run: |
          python3 - <<'PY'
          log = open('ci-out/build.log', errors='replace').read().splitlines()
          pick = set()
          for i, line in enumerate(log):
              if 'error:' in line or 'FAILED' in line or 'What went wrong' in line:
                  for j in range(max(0, i-2), min(len(log), i+8)):
                      pick.add(j)
          body = '\n'.join(log[i] for i in sorted(pick))[-14000:]
          chunks, cur, n = [], [], 0
          for line in body.splitlines():
              if n + len(line) + 1 > 3500:
                  chunks.append('\n'.join(cur)); cur=[]; n=0
              cur.append(line); n += len(line)+1
          if cur: chunks.append('\n'.join(cur))
          for i, c in enumerate(chunks[:4]):
              c = c.replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f"::error title=compile errors {i}::{c}")
          PY

      - name: Verify remapped mod jar contents
        run: |
          set -e
          JAR=$(ls build/libs/backrooms-*.jar | grep -v -- '-sources.jar' | head -1)
          echo "Inspecting $JAR"
          unzip -l "$JAR" > /tmp/jarlist.txt
          for entry in \
            "fabric.mod.json" \
            "net/backrooms/Backrooms.class" \
            "net/backrooms/worldgen/BackroomsChunkGenerator.class" \
            "net/backrooms/entity/BacteriaEntity.class" \
            "data/backrooms/dimension/backrooms.json" \
            "data/backrooms/worldgen/biome/backrooms.json" \
            "assets/backrooms/icon.png" \
            "assets/backrooms/textures/entity/bacteria.png" \
            "assets/backrooms/sounds/ambient/hum.ogg"; do
            if ! grep -q "$entry" /tmp/jarlist.txt; then
              echo "::error title=jar contents::missing $entry in $JAR"; exit 1
            fi
          done
          CLASSES=$(grep -c '\.class' /tmp/jarlist.txt || true)
          echo "::warning title=jar contents::$JAR contains $CLASSES class entries"
      - name: Upload mod jars
        if: always() && steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: backrooms-mod
          path: build/libs/*.jar
          if-no-files-found: error

  selftest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - name: EULA
        run: mkdir -p run && printf 'eula=true\n' > run/eula.txt
      - name: Headless in-engine self-test
        id: selftest
        timeout-minutes: 10
        run: |
          chmod +x ./gradlew
          # Modern dedicated servers wait harmlessly on stdin EOF; the self-test
          # calls System.exit with 0 (all checks passed) or 1 (failure).
          ./gradlew runServer -Pselftest --no-daemon --console=plain < /dev/null
          echo "runServer exited $?"
      - name: Publish self-test report
        if: always()
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          import os
          paths=['run/selftest-report.txt','/tmp/backrooms-selftest.txt']
          body=None
          for p in paths:
              if os.path.exists(p):
                  body=open(p,errors='replace').read(); break
          if body is None:
              log=''
              if os.path.exists('run/logs/latest.log'):
                  log=open('run/logs/latest.log',errors='replace').read()
              body='SELFTEST DID NOT COMPLETE\n----- server log tail -----\n'+log[-6000:]
          ok=body.startswith('SELFTEST OK')
          open('/tmp/selftest-ok','w').write('1' if ok else '0')
          chunks=[body[i:i+3300] for i in range(0,len(body),3300)]
          for i,c in enumerate(chunks[:6]):
              c=c.replace('%','%25').replace('\r','').replace('\n','%0A')
              print(f"::{'warning' if ok else 'error'} title=selftest {i}::{c}")
          PY
          test "$(cat /tmp/selftest-ok)" = "1"

  signatures:
    needs: build
    if: always()
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 5, 6, 7]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with: { java-version: '21', distribution: 'temurin' }
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x ./gradlew
      - run: ./gradlew genSources --no-daemon --console=plain
      - run: bash .github/ci_unzip_sources.sh
      - if: always()
        run: |
          RJAR=$(find "$HOME/.gradle/caches" -name 'fabric-rendering-v1*.jar' ! -name '*sources*' ! -name '*dev*' | head -1)
          JAVAP=$(javap -cp "$RJAR" 'net.fabricmc.fabric.api.client.rendering.v1.EntityModelLayerRegistry$TexturedModelDataProvider' 2>&1 | tr '\n' ' ')
          MAP=$(grep -rhoE 'class_560[^ ]*[^/]*' $(find "$HOME/.gradle/caches/fabric-loom" -name '*.tiny' 2>/dev/null) 2>/dev/null | sort -u | head -8 | tr '\n' ' ')
          MAPLINES=$(grep -rhE 'class_560[0-9]' $(find "$HOME/.gradle/caches/fabric-loom" -name 'mappings*.tiny' 2>/dev/null) 2>/dev/null | grep -v '	' | head -12 | tr '\n' ' ')
          MSG="javap=[$JAVAP] :: map5607=[$(grep -rh 'class_5607' $(find "$HOME/.gradle/caches/fabric-loom" -name '*.tiny' 2>/dev/null) 2>/dev/null | head -3 | tr '\n' '|')] :: map560x=[$MAPLINES]"
          echo "::warning title=find-modeldata::$MSG"
      - if: always()
        run: python3 .github/ci_dump_annotations.py ${{ matrix.shard }}
